plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = mod_version
group = mod_group

base {
    archivesName = "$mod_name-$minecraft_version-$project.name"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : "$mod_id-$project.name",
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
        ])
    }
}

repositories {
    maven { url = "https://maven.fabricmc.net" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.nucleoid.xyz" }
}

// Dev-only runtime mods (loom runs) that are not required/published transitive deps
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    implementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"

    implementation project(":shared")
    implementation project(":tuber")

    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$forgeconfigapiport_version"

    // Optional Polymer: compile against it, load it in runClient/runServer, do not jar-in-jar.
    // Do not pull polymer-sound-patcher: it rewrites vanilla wood hits into server-only sounds
    // in the Polymer RP, which mutes TreeChop clients that sync the real chopped-log block.
    compileOnly "eu.pb4:polymer-bundled:$polymer_version"
    localRuntime "eu.pb4:polymer-bundled:$polymer_version"
}

processResources {
    from project(":shared").sourceSets.main.resources
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand project.properties
    }
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

tasks.named("compileJava", JavaCompile).configure {
    source(project(":shared").sourceSets.main.java)
    source(project(":tuber").sourceSets.main.java)
}
